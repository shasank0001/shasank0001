        <rect x="15" y="32" width="12" height="12" rx="3"/><rect x="49" y="32" width="12" height="12" rx="3"/>
        <rect x="15" y="49" width="12" height="12" rx="3"/><rect x="32" y="49" width="12" height="12" rx="3"/>
      </g>
      <g fill="#EACB93"><rect x="32" y="32" width="12" height="12" rx="3"/><rect x="49" y="49" width="12" height="12" rx="3"/></g>
