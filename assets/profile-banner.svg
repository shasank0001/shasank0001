    <path d="M680 0H1200V240H720C771 176 739 94 680 0Z" fill="#E0EEF2"/>
    <rect x="695" width="505" height="240" fill="url(#dots)"/>
    <text x="52" y="91" font-family="DejaVu Sans, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.8" fill="#172C3C">Shasank Varma</text>
    <text x="55" y="130" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#395568">AI engineer</text>
    <text x="55" y="183" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#395568">Agentic RAG</text>
    <circle cx="214" cy="176" r="3" fill="#4F9396"/>
    <text x="231" y="183" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#395568">Efficient language models</text>

    <!-- Sources and connections -->
    <g fill="none" stroke="#83ADB9" stroke-width="2.3" stroke-linecap="round">
      <path d="M805 79C850 79 850 92 887 92"/>
      <path d="M800 158C851 158 854 133 890 133"/>
      <path d="M990 93C1031 93 1027 58 1063 58"/>
      <path d="M993 124C1044 124 1041 165 1085 165"/>
    </g>
