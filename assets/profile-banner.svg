      <rect width="49" height="62" rx="7" fill="#FFFFFF" stroke="#7698AC" stroke-width="2"/>
      <path d="M11 17H35M11 28H35M11 39H27" fill="none" stroke="#91ADBE" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(745 135) rotate(7 30 30)">
