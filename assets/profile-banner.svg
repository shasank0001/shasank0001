      <path d="m13 18-6 7 6 7m29-14 6 7-6 7m-18 2 7-18" fill="none" stroke="#4F9396" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 44H42" stroke="#CADCE4" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- A character echoing the profile avatar -->
    <path d="M870 240V195C870 158 891 143 941 143S1012 158 1012 195V240" fill="#FFFFFF" stroke="#203847" stroke-width="3.5"/>
    <circle cx="941" cy="97" r="54" fill="#FCFEFE" stroke="#203847" stroke-width="3.5"/>
    <circle cx="922" cy="96" r="6" fill="#203847"/>
    <circle cx="960" cy="96" r="6" fill="#203847"/>
    <path d="M932 112Q941 119 950 112" fill="none" stroke="#203847" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M884 189Q870 187 865 174M998 188Q1014 186 1019 171" fill="none" stroke="#203847" stroke-width="3.5" stroke-linecap="round"/>

    <!-- A compact agent graph -->
