<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Shasank Varma — AI engineer</title>
  <desc id="desc">A friendly round character connects documents, agent nodes, and a compact model. Agentic RAG and efficient language models.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ABC5D2" opacity="0.28"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
